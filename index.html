<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - Video Player</title>
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .player-container { width: 100%; max-width: 900px; position: relative; }
        video { width: 100%; border: 1px solid #333; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="mainPlayer" controls autoplay poster="">
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        // URL se parameters nikalne ke liye
        const params = new URLSearchParams(window.location.search);
        const videoSrc = params.get('v'); // Video Link
        const posterSrc = params.get('p'); // Poster/Image Link

        const player = document.getElementById('mainPlayer');

        if (videoSrc) {
            // Agar Dropbox link hai toh use direct link mein badalna
            let finalVideo = videoSrc.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
            player.src = finalVideo;
        }

        if (posterSrc) {
            player.poster = posterSrc;
        }
    </script>
</body>
</html>
