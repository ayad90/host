<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Link Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .panel { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #007bff; text-align: center; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .result { margin-top: 25px; padding: 15px; background: #252525; border-radius: 8px; display: none; border: 1px dashed #444; }
        #finalUrl { word-break: break-all; color: #00ff00; font-size: 13px; margin-bottom: 10px; display: block; }
        .copy-btn { background: #28a745; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Hosting Admin Panel</h2>
    
    <div class="group">
        <label>1. Your GitHub Page URL (e.g. https://603-ops.github.io/player/)</label>
        <input type="text" id="baseLink" placeholder="https://yourname.github.io/repo/">
    </div>

    <div class="group">
        <label>2. Video Link (Dropbox or GitHub direct link)</label>
        <input type="text" id="videoLink" placeholder="Paste link here">
    </div>

    <div class="group">
        <label>3. Poster/Image Link (IBB Link)</label>
        <input type="text" id="posterLink" placeholder="Paste IBB link here">
    </div>

    <button onclick="generateLink()">Generate Final Player Link</button>

    <div class="result" id="resultBox">
        <label>Share this link:</label>
        <span id="finalUrl"></span>
        <button class="copy-btn" onclick="copyText()">Copy Link</button>
    </div>
</div>

<script>
    function generateLink() {
        let base = document.getElementById('baseLink').value.trim();
        let video = document.getElementById('videoLink').value.trim();
        let poster = document.getElementById('posterLink').value.trim();

        if(!base || !video) { alert("Base URL and Video Link are required!"); return; }

        if(!base.endsWith('/')) base += '/';

        // Final URL Structure
        let final = `${base}?v=${encodeURIComponent(video)}&p=${encodeURIComponent(poster)}`;

        document.getElementById('finalUrl').innerText = final;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyText() {
        let link = document.getElementById('finalUrl').innerText;
        navigator.clipboard.writeText(link);
        alert("Link copied to clipboard!");
    }
</script>
</body>
</html>
