<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Hosting - Video Player</title>
    <style>
        :root { --primary: #007bff; --dark: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 0; }
        
        /* Navbar */
        nav { background: #000; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }

        /* Main Container */
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }

        /* Upload Section */
        .upload-box { background: var(--card); padding: 30px; border-radius: 12px; text-align: center; border: 2px dashed #444; margin-bottom: 40px; }
        input[type="text"], input[type="password"] { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* Video Player Section */
        .player-section { display: none; margin-bottom: 40px; text-align: center; }
        video { width: 100%; max-height: 500px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,123,255,0.3); }

        /* Video List/Library */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .video-card { background: var(--card); padding: 15px; border-radius: 10px; transition: 0.3s; cursor: pointer; }
        .video-card:hover { transform: translateY(-5px); border: 1px solid var(--primary); }
        .video-card img { width: 100%; border-radius: 8px; }
        .video-card h3 { font-size: 16px; margin: 10px 0; }
    </style>
</head>
<body>

<nav>
    <div class="logo">MY-CLOUD HOSTING</div>
    <div class="user-info">Admin Panel</div>
</nav>

<div class="container">
    <!-- Player Section (Jab video play karni ho) -->
    <div class="player-section" id="playerSection">
        <h2 id="nowPlaying">Playing Video</h2>
        <video id="mainPlayer" controls autoplay></video>
        <br>
        <button class="btn" onclick="closePlayer()">Close Player</button>
    </div>

    <!-- Upload Panel -->
    <div class="upload-box">
        <h3>Upload New Video to Hosting</h3>
        <input type="password" id="token" placeholder="Enter GitHub Token"><br>
        <input type="text" id="repoPath" placeholder="username/repo_name (e.g. 603-ops/my-hosting)"><br>
        <input type="file" id="fileInput" accept="video/mp4"><br>
        <button class="btn" onclick="uploadToHosting()">Upload Now</button>
        <p id="status"></p>
    </div>

    <!-- Library -->
    <h2>Your Hosted Videos</h2>
    <div class="grid" id="videoGrid">
        <!-- Videos yahan dikhengi -->
        <p>No videos uploaded yet. Upload your first video!</p>
    </div>
</div>

<script>
    // 1. Upload Function
    async function uploadToHosting() {
        const token = document.getElementById('token').value;
        const repo = document.getElementById('repoPath').value;
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');

        if(!token || !fileInput.files[0]) { alert("Token and File are required!"); return; }

        const file = fileInput.files[0];
        const fileName = "videos/" + file.name.replace(/\s+/g, '_');
        status.innerText = "Uploading... Please wait.";

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const content = reader.result.split(',')[1];
            const url = `https://api.github.com/repos/${repo}/contents/${fileName}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Hosted: ${file.name}`, content: content })
                });

                if(response.ok) {
                    status.innerText = "Success! Video Hosted.";
                    location.reload(); // Refresh to show new video
                } else {
                    status.innerText = "Error: Upload failed.";
                }
            } catch (e) { status.innerText = "Network Error."; }
        };
    }

    // 2. Play Function
    function playVideo(url, name) {
        const section = document.getElementById('playerSection');
        const player = document.getElementById('mainPlayer');
        const title = document.getElementById('nowPlaying');

        // GitHub Raw Link Conversion
        // https://github.com/user/repo/blob/main/videos/vid.mp4 -> https://raw.githubusercontent.com/user/repo/main/videos/vid.mp4
        let rawUrl = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        
        player.src = rawUrl;
        title.innerText = "Playing: " + name;
        section.style.display = 'block';
        window.scrollTo(0,0);
    }

    function closePlayer() {
        document.getElementById('playerSection').style.display = 'none';
        document.getElementById('mainPlayer').pause();
    }

    // 3. (Optional) Isme aap manually apni uploaded videos ki list array mein daal sakte hain
    // Ya GitHub API se fetch kar sakte hain list.
</script>
</body>
</html>
