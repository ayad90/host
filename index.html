<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Player</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; }
        video { width: 100%; max-height: 100vh; }
    </style>
</head>
<body>
    <video id="videoPlayer" controls autoplay></video>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('v'); // URL se file ka naam lega
        if (fileName) {
            document.getElementById('videoPlayer').src = fileName;
        }
    </script>
</body>
</html>
