<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Hosting</title>
    <style>
        body { margin:0; background:#121212; color:white; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        .player-box { width:90%; max-width:800px; border:2px solid #333; border-radius:10px; overflow:hidden; background:#000; }
        video { width:100%; display:block; }
        .info { padding:15px; text-align:center; }
    </style>
</head>
<body>

    <div class="player-box">
        <!-- Poster URL i se aayega, Video URL v se aayega -->
        <video id="myVideo" controls autoplay poster=""></video>
        <div class="info">
            <h3 id="vTitle">Playing Video...</h3>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoFileName = params.get('v'); // Video file ka naam
        const posterLink = params.get('i');    // IBB link

        const videoPlayer = document.getElementById('myVideo');

        if(videoFileName) {
            // Ye code apne aap aapki repo se video utha lega
            videoPlayer.src = videoFileName; 
            document.getElementById('vTitle').innerText = videoFileName;
        }
        if(posterLink) {
            videoPlayer.poster = posterLink;
        }
    </script>
</body>
</html>
